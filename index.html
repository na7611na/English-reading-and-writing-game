<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>리딩&라이팅 퀘스트</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <button id="back-btn" class="icon-btn" aria-label="뒤로">←</button>
  <div class="topbar-title">📚 리딩&amp;라이팅 퀘스트</div>
  <button id="home-btn" class="icon-btn" aria-label="처음으로">🏠</button>
</header>

<div id="hud" class="hud hidden">
  <span id="hud-progress">문제 0 / 0</span>
  <span id="hud-score">점수 0</span>
</div>

<main id="app">

  <!-- 홈 화면 -->
  <section id="screen-home" class="screen">
    <div class="hero-card">
      <div class="hero-emoji">🎮📖✏️</div>
      <h1>리딩&amp;라이팅 퀘스트</h1>
      <p class="subtitle">교과서 주요 표현을 읽고 쓰며 정복하는 태블릿 게임</p>
    </div>

    <div class="card">
      <label class="field-label" for="student-name-input">내 이름</label>
      <input id="student-name-input" class="text-input" type="text" placeholder="이름을 입력하세요" maxlength="12">
      <div id="student-level" class="student-level"></div>
    </div>

    <div class="card set-info-card">
      <div class="field-label">현재 표현 세트</div>
      <div id="active-set-name" class="active-set-name">-</div>
      <div id="active-set-count" class="active-set-count"></div>
    </div>

    <button id="go-modeselect-btn" class="btn-primary btn-big">🚀 게임 시작하기</button>
    <button id="go-setup-btn" class="btn-secondary btn-big">📋 표현 목록 관리 (교사용)</button>
    <button id="go-stats-btn" class="btn-link">📊 내 학습 기록 보기</button>
  </section>

  <!-- 표현 목록 관리 (교사용) -->
  <section id="screen-setup" class="screen">
    <h2>📋 표현 목록 관리</h2>
    <p class="hint">학생들이 읽고 쓸 영어 표현과 우리말 뜻을 입력하세요. 단원별로 세트를 나눠 관리할 수 있어요.</p>

    <div class="card">
      <label class="field-label" for="set-select">세트 선택</label>
      <select id="set-select" class="text-input"></select>
      <div class="btn-row">
        <button id="new-set-btn" class="btn-secondary">+ 새 세트</button>
        <button id="activate-set-btn" class="btn-secondary">✅ 이 세트를 활성화</button>
        <button id="delete-set-btn" class="btn-danger">🗑 세트 삭제</button>
      </div>
    </div>

    <div class="card">
      <label class="field-label" for="set-name-input">세트 이름</label>
      <input id="set-name-input" class="text-input" type="text" placeholder="예: Lesson 3 - 학교 생활">
    </div>

    <div class="card">
      <label class="field-label">빠른 붙여넣기 가져오기</label>
      <p class="hint">한 줄에 하나씩, <code>영어 표현 = 한국어 뜻</code> 형식으로 붙여넣으세요.</p>
      <textarea id="bulk-input" class="textarea" rows="5" placeholder="I ride a bike. = 나는 자전거를 타.&#10;What do you do in your free time? = 너는 여가 시간에 뭐 해?"></textarea>
      <button id="bulk-apply-btn" class="btn-secondary">⬇ 목록에 추가하기</button>
    </div>

    <div class="card">
      <label class="field-label">표현 목록</label>
      <div id="rows-wrap" class="rows-wrap"></div>
      <button id="add-row-btn" class="btn-secondary">+ 표현 한 줄 추가</button>
    </div>

    <div class="btn-row">
      <button id="save-set-btn" class="btn-primary btn-big">💾 저장하기</button>
      <button id="reset-sample-btn" class="btn-link">샘플 데이터로 초기화</button>
    </div>
    <div id="setup-msg" class="feedback"></div>
  </section>

  <!-- 게임 모드 선택 -->
  <section id="screen-modeselect" class="screen">
    <h2>어떤 게임을 할까요?</h2>
    <p id="modeselect-set" class="hint"></p>

    <h3 class="section-title">📖 읽기 게임</h3>
    <div class="mode-grid">
      <button class="mode-tile" data-game="quiz">
        <div class="mode-emoji">🎯</div>
        <div class="mode-name">4지선다 스피드 퀴즈</div>
        <div class="mode-desc">뜻을 보고 알맞은 영어 표현을 고르세요</div>
      </button>
      <button class="mode-tile" data-game="match">
        <div class="mode-emoji">🃏</div>
        <div class="mode-name">카드 매칭 게임</div>
        <div class="mode-desc">영어와 뜻이 적힌 카드를 짝지어 보세요</div>
      </button>
    </div>

    <h3 class="section-title">✏️ 쓰기 게임</h3>
    <div class="mode-grid">
      <button class="mode-tile" data-game="spelling">
        <div class="mode-emoji">🔤</div>
        <div class="mode-name">스펠링 챌린지</div>
        <div class="mode-desc">뜻을 보고 영어 표현을 직접 입력하세요</div>
      </button>
      <button class="mode-tile" data-game="builder">
        <div class="mode-emoji">🧩</div>
        <div class="mode-name">문장 조립 게임</div>
        <div class="mode-desc">단어 조각을 순서대로 눌러 문장을 완성하세요</div>
      </button>
      <button class="mode-tile" data-game="dictation">
        <div class="mode-emoji">🎧</div>
        <div class="mode-name">받아쓰기 챌린지</div>
        <div class="mode-desc">소리를 듣고 영어로 받아쓰세요</div>
      </button>
    </div>
  </section>

  <!-- 게임 플레이 화면 -->
  <section id="screen-play" class="screen">
    <div id="play-container"></div>
  </section>

  <!-- 결과 화면 -->
  <section id="screen-result" class="screen">
    <div class="result-card">
      <div id="result-emoji" class="result-emoji">🎉</div>
      <h2 id="result-title">잘했어요!</h2>
      <div class="result-stats">
        <div class="stat-box"><span id="result-score">0</span><label>점수</label></div>
        <div class="stat-box"><span id="result-accuracy">0%</span><label>정답률</label></div>
        <div class="stat-box"><span id="result-xp">+0</span><label>XP 획득</label></div>
      </div>
    </div>

    <div id="missed-wrap" class="card missed-wrap hidden">
      <div class="field-label">🔁 다시 확인해볼 표현</div>
      <div id="missed-list" class="missed-list"></div>
    </div>

    <button id="retry-missed-btn" class="btn-primary btn-big hidden">🔁 틀린 표현만 다시 풀기</button>
    <button id="retry-same-btn" class="btn-secondary btn-big">🔄 같은 게임 다시 하기</button>
    <button id="other-game-btn" class="btn-secondary btn-big">🎮 다른 게임 하기</button>
    <button id="result-home-btn" class="btn-link">🏠 처음으로</button>
  </section>

  <!-- 학습 기록 -->
  <section id="screen-stats" class="screen">
    <h2>📊 내 학습 기록</h2>
    <div class="card">
      <div id="stats-summary" class="stats-summary"></div>
    </div>
    <div class="card">
      <div class="field-label">최근 활동</div>
      <div id="stats-history" class="stats-history"></div>
    </div>
    <button class="btn-link" onclick="goHome()">🏠 처음으로</button>
  </section>

</main>

<script src="js/utils.js"></script>
<script src="js/speech.js"></script>
<script src="js/data.js"></script>
<script src="js/games.js"></script>
<script src="js/app.js"></script>
</body>
</html>
